name: CI/CD Pipeline with PipelineIQ

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

permissions:
  contents: write
  pull-requests: write
  
env:
  NODE_VERSION: '20'

jobs:
  # Build and Test Application
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
        
  # PipelineIQ Integration - Always runs to handle failures
  pipelineiq-failure-handler:
    runs-on: ubuntu-latest
    if: always() && (needs.build-and-test.result == 'failure' || needs.build-and-test.result == 'cancelled')
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PipelineIQ CLI
        run: npm install -g pipelineiq

      - name: Create Jira ticket with PipelineIQ
        run: |
          pipelineiq analyze \
            --jira-url ${{ secrets.JIRA_URL }} \
            --jira-project "SCRUM" \
            --jira-email ${{ secrets.JIRA_EMAIL }} \
            --jira-token ${{ secrets.JIRA_TOKEN }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --ai-mode assist \
            --ai-provider gemini \
            --ai-model gemini-2.5-flash-lite \
            --ai-api-key ${{ secrets.AI_API_KEY }} \
            --environment ${{ github.ref_name }} \
            --repository ${{ github.repository }} \
            --branch ${{ github.ref_name }} \
            --commit ${{ github.sha }} \
            --pipeline ${{ github.workflow }} \
            --run-id ${{ github.run_id }} \
            --run-number ${{ github.run_number }} \
            --actor ${{ github.actor }} \
            --issue-type Bug \
            --event-name ${{ github.event_name }} \
            --run-attempt ${{ github.run_attempt }} \
            --runner-os ${{ runner.os }} \
            --runner-arch ${{ runner.arch }} \
            --api-url ${{ github.api_url }} \
            --job-name ${{ github.job }} \
            --repository-owner ${{ github.repository_owner }} \
            --format github-actions \
            --self-heal \
            --self-heal-confidence 0.8 \
            --self-heal-max-files 10 \
            --self-heal-max-lines 200 \
            --self-heal-draft \
            --self-heal-reviewers "meetpatel1111" \
            --self-heal-labels "self-healed,automated" \
            --self-heal-categories "build,test,lint" \
            --self-heal-verify \
            --self-heal-verification-commands "npm install,npm run build" \
            --self-heal-auto-lockfile \
            --dedup-window 24
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
                
  # Notification Job
  notify:
    runs-on: ubuntu-latest
    if: always()
    needs: build-and-test
    
    steps:
      - name: Notify on success
        if: needs.build-and-test.result == 'success'
        run: |
          echo "✅ Pipeline completed successfully!"
          
      - name: Notify on failure
        if: needs.build-and-test.result == 'failure'
        run: |
          echo "❌ Pipeline failed!"
          echo "Check PipelineIQ for Jira ticket creation"
