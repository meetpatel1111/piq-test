name: Multi-Language CI/CD with PipelineIQ

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Multi-Language Build & Test Matrix
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (TypeScript)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 1. Build TypeScript Application
        run: |
          npm ci
          npm run build

      - name: 2. Test Go Module
        run: |
          cd golang
          go test -v ./...

      - name: 3. Test Rust Crate
        run: |
          cd rust
          cargo test --verbose

      - name: 4. Test Python Suite
        run: |
          python -m unittest discover -s python -v

  # PipelineIQ Autonomous Self-Healing & Incident Handler
  pipelineiq-failure-handler:
    runs-on: ubuntu-latest
    if: always() && (needs.build-and-test.result == 'failure' || needs.build-and-test.result == 'cancelled')
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout PipelineIQ (main branch)
        uses: actions/checkout@v4
        with:
          repository: meetpatel1111/PipelineIQ
          ref: main
          path: _piq

      - name: Install PipelineIQ runtime deps and build
        run: |
          npm ci
          npm run build
          npm install -g .
        working-directory: _piq

      - name: Autonomous AI Self-Healing & Jira Creation
        run: |
          pipelineiq analyze \
            --jira-url "${{ secrets.JIRA_URL }}" \
            --jira-project "SCRUM" \
            --jira-email "${{ secrets.JIRA_EMAIL }}" \
            --jira-token "${{ secrets.JIRA_TOKEN }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --ai-mode assist \
            --ai-provider gemini \
            --ai-model "gemini-2.5-flash" \
            --ai-api-key "${{ secrets.AI_API_KEY }}" \
            --environment "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --pipeline "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --actor "${{ github.actor }}" \
            --issue-type Bug \
            --event-name "${{ github.event_name }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --runner-os "${{ runner.os }}" \
            --runner-arch "${{ runner.arch }}" \
            --api-url "${{ github.api_url }}" \
            --job-name "${{ github.job }}" \
            --repository-owner "${{ github.repository_owner }}" \
            --format github-actions \
            --self-heal \
            --self-heal-confidence 0.7 \
            --self-heal-max-files 10 \
            --self-heal-max-lines 200 \
            --self-heal-draft \
            --self-heal-reviewers "meetpatel1111" \
            --self-heal-labels "self-healed,multi-language" \
            --self-heal-categories "*" \
            --self-heal-verify \
            --self-heal-auto-lockfile \
            --dedup-window 24
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
